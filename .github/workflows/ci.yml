name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the in-progress run (saves minutes + API $).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Always runs: fast, free, deterministic. No heavy ML deps, no API keys. ──────────
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lightweight tools
        run: pip install ruff mypy pytest pydantic
      # Linters are scoped to evals/ (new code). Retrofitting ruff/mypy onto the legacy
      # src/ tree is WIN 0 of the plan; widen this path as that cleanup lands.
      - name: Lint
        run: ruff check evals/
      - name: Typecheck (eval harness)
        run: mypy evals --ignore-missing-imports --follow-imports=skip
      - name: Unit tests (metric math — no network/keys)
        run: pytest evals/test_metrics.py -q

  # ── Retrieval regression gate: heavy + costs a few cents, so only on pipeline changes.
  #    Always REPORTS a status (so it can be a required check) but only spends when relevant.
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect pipeline changes
        id: changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            pipeline:
              - 'src/retrieval/**'
              - 'src/reranking/**'
              - 'src/generation/**'
              - 'src/ingestion/**'
              - 'evals/**'
              - 'config.py'
              - 'requirements.txt'

      - name: Skip (no pipeline changes)
        if: steps.changed.outputs.pipeline != 'true'
        run: echo "No retrieval-affecting changes — eval skipped, gate passes."

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.pipeline == 'true'
        with:
          python-version: "3.10"
          cache: pip
      - name: Install deps
        if: steps.changed.outputs.pipeline == 'true'
        run: pip install -r requirements.txt

      - name: Retrieval regression gate (1 retry on transient failure)
        if: steps.changed.outputs.pipeline == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
        run: |
          python -m evals.check_regression --index beir-scifact \
          || python -m evals.check_regression --index beir-scifact
